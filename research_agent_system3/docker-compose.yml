version: "3.9"

services:
  ollama:
    image: ollama/ollama:latest
    ports:
      - "11434:11434"
    volumes:
      - ollama_data:/root/.ollama
    restart: unless-stopped

  mcp-server:
    build:
      context: .
      dockerfile: Dockerfile.mcp
    ports:
      - "8000:8000"
    environment:
      - SEARCH_PROVIDER=${SEARCH_PROVIDER:-duckduckgo}
      - SEARCH_PROVIDER_FALLBACK=${SEARCH_PROVIDER_FALLBACK:-duckduckgo}
      - TAVILY_API_KEY=${TAVILY_API_KEY:-}
      - SERPAPI_API_KEY=${SERPAPI_API_KEY:-}
      - BRAVE_API_KEY=${BRAVE_API_KEY:-}
      - JOB_SEARCH_ENABLED=${JOB_SEARCH_ENABLED:-true}
      - JOB_SEARCH_PLATFORMS=${JOB_SEARCH_PLATFORMS:-linkedin,indeed,wuzzuf,glassdoor,bayt,wellfound}
      - MAX_SEARCH_QUERIES=${MAX_SEARCH_QUERIES:-4}
      - MAX_RESULTS_PER_SOURCE=${MAX_RESULTS_PER_SOURCE:-5}
      - MAX_TOTAL_RESULTS=${MAX_TOTAL_RESULTS:-30}
      - MAX_CONCURRENT_SEARCHES=${MAX_CONCURRENT_SEARCHES:-5}
      - SEARCH_TIMEOUT=${SEARCH_TIMEOUT:-15.0}
      - REQUEST_TIMEOUT=${REQUEST_TIMEOUT:-10.0}
      - SEARCH_RETRIES=${SEARCH_RETRIES:-1}
    restart: unless-stopped

  app:
    build:
      context: .
      dockerfile: Dockerfile.streamlit
    ports:
      - "8501:8501"
    environment:
      - OLLAMA_BASE_URL=http://ollama:11434
      - MCP_SERVER_URL=http://mcp-server:8000/mcp
      - SEARCH_TIME_LIMIT=${SEARCH_TIME_LIMIT:-y}
      - SEARCH_PROVIDER=${SEARCH_PROVIDER:-duckduckgo}
      - LANGSMITH_API_KEY=${LANGSMITH_API_KEY:-}
      - LANGSMITH_PROJECT=${LANGSMITH_PROJECT:-multi-agent-research}
    depends_on:
      - ollama
      - mcp-server
    restart: unless-stopped

volumes:
  ollama_data:
